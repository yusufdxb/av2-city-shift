name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci.txt
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned test dependencies and package
        run: python -m pip install -r requirements/ci.txt -e '.[dev,figures]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q tests
